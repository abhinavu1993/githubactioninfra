name: Terraform Preprod Pipeline

on:
  push:
    branches:
      - 'feature/*'   # sirf feature branches pe trigger hoga

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0   # apne version ke hisaab se

      - name: Terraform Init
        run: terraform init
        working-directory: ./environment/preprod

      - name: Terraform Plan
        run: terraform plan -var-file=terraform.tfvars
        working-directory: ./environment/preprod
