name: Feature Branch Pipeline

on:
  push:
    branches:
      - 'feature/*'   # sirf feature branches pe trigger hoga

jobs:
  build-and-plan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0   # apne version ke hisaab se

      # Step 3: Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Step 4: Run Terraform Plan
      - name: Terraform Plan
        run: terraform plan
